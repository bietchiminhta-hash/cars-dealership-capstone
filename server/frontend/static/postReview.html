<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Post Review</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-light px-4">
    <a class="navbar-brand" href="/">Best Cars Dealership</a>
    <div class="collapse navbar-collapse">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="/static/About.html">About Us</a></li>
        <li class="nav-item"><a class="nav-link" href="/static/Contact.html">Contact Us</a></li>
      </ul>
    </div>
  </nav>

  <div class="container mt-5" style="max-width:500px">
    <h2 class="mb-4">Post Review</h2>

    <div class="mb-3">
      <label class="form-label">Review</label>
      <textarea id="reviewText" class="form-control" rows="4" placeholder="Write your review here..."></textarea>
    </div>

    <div class="form-check mb-3">
      <input type="checkbox" class="form-check-input" id="purchaseCheck">
      <label class="form-check-label" for="purchaseCheck">I purchased a car here</label>
    </div>

    <div class="mb-3">
      <label class="form-label">Purchase Date</label>
      <input type="date" id="purchaseDate" class="form-control">
    </div>

    <div class="mb-3">
      <label class="form-label">Car Make</label>
      <select id="carMake" class="form-select">
        <option value="Toyota">Toyota</option>
        <option value="Honda">Honda</option>
        <option value="Ford">Ford</option>
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label">Car Model</label>
      <input type="text" id="carModel" class="form-control" placeholder="e.g. Camry">
    </div>

    <div class="mb-3">
      <label class="form-label">Car Year</label>
      <input type="number" id="carYear" class="form-control" placeholder="e.g. 2022">
    </div>

    <button class="btn btn-primary w-100" onclick="postReview()">Post Review</button>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const dealerId = params.get("id");

    function postReview() {
      const payload = {
        name: sessionStorage.getItem("username") || "Anonymous",
        dealership: dealerId,
        review: document.getElementById("reviewText").value,
        purchase: document.getElementById("purchaseCheck").checked,
        purchase_date: document.getElementById("purchaseDate").value,
        car_make: document.getElementById("carMake").value,
        car_model: document.getElementById("carModel").value,
        car_year: document.getElementById("carYear").value
      };

      fetch("/djangoapp/review", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(data => {
        window.location.href = "/dealer?id=" + dealerId;
      });
    }
  </script>
</body>
</html>
