<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Best Cars Dealership - Home</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-light px-4">
    <a class="navbar-brand" href="./index.html">Best Cars Dealership</a>
    <div class="collapse navbar-collapse">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link active" href="./index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="./About.html">About Us</a></li>
        <li class="nav-item"><a class="nav-link" href="./Contact.html">Contact Us</a></li>
      </ul>
    </div>
  </nav>

  <div class="container mt-5">
    <h1 class="text-center mb-4">Our Dealers</h1>
    <table class="table table-striped" id="dealersTable">
      <thead>
        <tr>
          <th>ID</th>
          <th>Dealer Name</th>
          <th>City</th>
          <th>State</th>
          <th>Address</th>
        </tr>
      </thead>
      <tbody id="dealersBody"></tbody>
    </table>
  </div>

  <script>
    // Gọi API Django lấy danh sách dealers, render ra bảng
    fetch("/djangoapp/get_dealers")
      .then(res => res.json())
      .then(data => {
        const body = document.getElementById("dealersBody");
        data.dealers.forEach(d => {
          const row = `<tr>
            <td>${d.id}</td>
            <td>${d.full_name}</td>
            <td>${d.city}</td>
            <td>${d.state}</td>
            <td>${d.address}</td>
          </tr>`;
          body.innerHTML += row;
        });
      });
  </script>
</body>
</html>
