<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dealer Details</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-light px-4">
    <a class="navbar-brand" href="/">Best Cars Dealership</a>
    <div class="collapse navbar-collapse">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="/static/About.html">About Us</a></li>
        <li class="nav-item"><a class="nav-link" href="/static/Contact.html">Contact Us</a></li>
      </ul>
    </div>
  </nav>

  <div class="container mt-5">
    <div id="dealerInfo" class="mb-4"></div>
    <a id='postReviewLink' href='#' class='btn btn-success mb-3'>Write a Review</a><h3>Reviews</h3>
    <div id="reviewsList"></div>
  </div>

  <script>
    // Lay id dealer tu URL, vi du: /static/dealer.html?id=1
    const params = new URLSearchParams(window.location.search);
    const dealerId = params.get("id");
    document.getElementById("postReviewLink").href = "/static/postReview.html?id=" + dealerId;

    fetch("/djangoapp/dealer/" + dealerId)
      .then(res => res.json())
      .then(data => {
        const d = data.dealer;
        document.getElementById("dealerInfo").innerHTML =
          "<h2>" + d.full_name + "</h2>" +
          "<p>" + d.address + ", " + d.city + ", " + d.state + " " + d.zip + "</p>";
      });

    fetch("/djangoapp/reviews/dealer/" + dealerId)
      .then(res => res.json())
      .then(data => {
        const list = document.getElementById("reviewsList");
        if (data.reviews.length === 0) {
          list.innerHTML = "<p>No reviews yet.</p>";
          return;
        }
        data.reviews.forEach(r => {
          const card = "<div class='card mb-2 p-3'>" +
            "<strong>" + r.name + "</strong>" +
            "<p>" + r.review + "</p>" +
            "<small>Car: " + r.car_year + " " + r.car_make + " " + r.car_model + "</small>" +
            "</div>";
          list.innerHTML += card;
        });
      });
  </script>
</body>
</html>
